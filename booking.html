<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a Service - ASTRA Connect</title>
</head>

<body style="font-family:Arial;background:#111;color:white;text-align:center;padding:20px;">

<h1 style="color:gold;">Book a Service</h1>

<form>
<p>
<input type="text" placeholder="Full Name" style="width:90%;padding:10px;">
</p>

<p>
<input type="tel" placeholder="Phone Number" style="width:90%;padding:10px;">
</p>

<p>
<select style="width:90%;padding:10px;">
<option>Select Service</option>
<option>Plumber</option>
<option>Electrician</option>
<option>Cleaner</option>
<option>Mechanic</option>
<option>Painter</option>
<option>AC Technician</option>
</select>
</p>

<p>
<textarea placeholder="Describe your problem" style="width:90%;height:120px;"></textarea>
</p>

<button style="padding:15px 30px;background:gold;border:none;font-size:18px;">
Submit Booking
</button>

</form>

</body>
  </html>
