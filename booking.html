<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a Service - ASTRA Connect</title>
  <link rel="stylesheet" href="style.css">
</head>

<body style="font-family:Arial;background:#111;color:white;text-align:center;padding:20px;">

<h1 style="color:gold;">Book a Service</h1>

<input id="name" type="text" placeholder="Full Name" style="width:90%;padding:10px;margin:10px;"><br>

<input id="phone" type="tel" placeholder="Phone Number" style="width:90%;padding:10px;margin:10px;"><br>

<select id="service" style="width:90%;padding:10px;margin:10px;">
<option>Plumber</option>
<option>Electrician</option>
<option>Cleaner</option>
<option>Mechanic</option>
<option>Painter</option>
<option>AC Technician</option>
</select><br>

<textarea id="problem" placeholder="Describe your problem" style="width:90%;height:120px;margin:10px;"></textarea><br>

<button onclick="sendWhatsApp()" style="padding:15px 30px;background:gold;border:none;font-size:18px;border-radius:8px;">
Submit Booking
</button>

<script src="script.js"></script>html>
